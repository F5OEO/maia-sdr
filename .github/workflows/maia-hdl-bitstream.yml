name: maia-hdl bitstream

concurrency:
  group: bitstream-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main, develop, refactor]
    paths: ["maia-hdl/**"]
  workflow_dispatch:
    inputs:
      projects:
        description: "Space-separated project list (all if empty)"
        required: false
        default: ""

env:
  VIVADO_IMAGE: xilinx-vivado:2025.2
  VIVADO_SETTINGS: /opt/Xilinx/2025.2/Vivado/.settings64-Vivado.sh
  RELEASE_TAG: vivado-2025.2
  RELEASE_REPO: gretel/maia-sdr

jobs:
  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          ALL='["pluto","plutoplus","e200","e310","libre","fishball7010","fishball7020","signalsdrpro","plutoskyr2","nano"]'
          if [ -z "${{ inputs.projects }}" ]; then
            echo "matrix={\"project\":$ALL}" >> "$GITHUB_OUTPUT"
          else
            FILTERED="$(echo "${{ inputs.projects }}" | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')"
            echo "matrix={\"project\":$FILTERED}" >> "$GITHUB_OUTPUT"
          fi

  bitstream:
    name: ${{ matrix.project }}
    needs: matrix-prep
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.matrix-prep.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /opt/ghc
          df -h / | tail -1

      - name: Download Vivado image from release
        run: |
          gh release download ${{ env.RELEASE_TAG }} \
            --repo ${{ env.RELEASE_REPO }} \
            --pattern 'vivado-chunk-*'
          cat vivado-chunk-* | docker load
          rm -f vivado-chunk-*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.project }} bitstream
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            ${{ env.VIVADO_IMAGE }} \
            bash -c '
              set -e
              : > /etc/os-release
              apt-get update -qq
              apt-get install -y -qq python3-pip libpixman-1-0
              pip install -q amaranth amaranth-yosys numpy scipy
              rm -f /lib/x86_64-linux-gnu/libudev.so.1.7.2 /lib/x86_64-linux-gnu/libudev.so.1
              ldconfig 2>/dev/null || true

              source ${{ env.VIVADO_SETTINGS }}

              cd /work/maia-hdl/ip
              make

              cd /work/maia-hdl/projects/tezuka
              ADI_IGNORE_VERSION_CHECK=1 make lib

              cd /work/maia-hdl/projects
              MALLOC_CHECK_=0 PROJECT_NAME=${{ matrix.project }} vivado -mode batch -source ../ci/build.ci.tcl
            '

      - name: Copy XSA to predictable path
        run: |
          cp maia-hdl/projects/tezuka/${{ matrix.project }}.sdk/system_top*.xsa ./${{ matrix.project }}.xsa 2>/dev/null || true

      - name: Upload bitstream
        uses: actions/upload-artifact@v7
        with:
          name: bitstream-${{ matrix.project }}
          path: |
            ${{ matrix.project }}.bin
            ${{ matrix.project }}.xsa
          if-no-files-found: warn

      - name: Print timing summary
        run: |
          RPT=${{ matrix.project }}_timing.rpt
          # Parse timing table from .rpt (column 1 = WNS, 2 = TNS, 5 = WHS, 6 = THS)
          if [ -f "$RPT" ]; then
            vals=$(awk '/^\s*WNS\(ns\)/{for(i=0;i<2;i++){getline} print \$1, \$2, \$5, \$6}' "$RPT" 2>/dev/null | head -1)
            WNS=$(echo "$vals" | cut -d' ' -f1)
            TNS=$(echo "$vals" | cut -d' ' -f2)
            WHS=$(echo "$vals" | cut -d' ' -f3)
            THS=$(echo "$vals" | cut -d' ' -f4)
          fi
          # Fallback: grep Vivado log for WNS= pattern
          if [ -z "$WNS" ] || [ "$WNS" = "0.000" ]; then
            LOG=../${{ matrix.project }}_vivado.log
            if [ ! -f "$LOG" ]; then LOG=/dev/null; fi
            WNS=${WNS:-$(grep -oP "Post Routing Timing Summary .*? WNS=\K[+-]?[0-9.]+(?!.*WNS=)" "$LOG" 2>/dev/null | tail -1)}
            TNS=${TNS:-$(grep -oP "Post Routing Timing Summary .*? TNS=\K[+-]?[0-9.]+(?!.*TNS=)" "$LOG" 2>/dev/null | tail -1)}
            WHS=${WHS:-$(grep -oP "Post Routing Timing Summary .*? WHS=\K[+-]?[0-9.]+(?!.*WHS=)" "$LOG" 2>/dev/null | tail -1)}
            THS=${THS:-$(grep -oP "Post Routing Timing Summary .*? THS=\K[+-]?[0-9.]+(?!.*THS=)" "$LOG" 2>/dev/null | tail -1)}
          fi
          echo "### ${{ matrix.project }} Timing" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ -n "$WNS" ]; then
            [ "$(echo "$WNS >= 0" | bc -l 2>/dev/null)" = 1 ] && S="✅" || S="❌"
            echo "| Setup WNS | ${WNS}ns | $S |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Setup WNS | N/A | ❓ |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$WHS" ]; then
            [ "$(echo "$WHS >= 0" | bc -l 2>/dev/null)" = 1 ] && H="✅" || H="⚠️"
            echo "| Hold WHS | ${WHS}ns | $H |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Hold WHS | N/A | ❓ |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| TNS | ${TNS:-N/A} | |" >> $GITHUB_STEP_SUMMARY
          echo "| THS | ${THS:-N/A} | |" >> $GITHUB_STEP_SUMMARY
        if: always()

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.project }}
          path: |
            ${{ matrix.project }}_timing.rpt
            ${{ matrix.project }}_utilization.rpt
            ${{ matrix.project }}_power.rpt
          if-no-files-found: warn
